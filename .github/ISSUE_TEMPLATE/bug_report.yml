name: Bug 反馈
description: 报告导入、浏览、搜索等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请勿粘贴完整对话内容或敏感信息。
        已知限制见 [KNOWN_ISSUES.md](../KNOWN_ISSUES.md)。

  - type: input
    id: version
    attributes:
      label: Chatilus 版本
      placeholder: "例如 0.2.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - 其他
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: 相关数据源
      options:
        - ChatGPT
        - Cursor
        - Gemini
        - Codex
        - Copilot
        - Grok
        - DeepSeek
        - 其他 / 不确定
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 尽量具体，例如「导入 ChatGPT ZIP → 打开某对话 → …」
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 错误信息（如有）
      description: 可从导入失败对话框复制，或粘贴简短报错

  - type: textarea
    id: extra
    attributes:
      label: 其他信息
      description: 数据规模（约多少对话/消息）、截图等
